# ============================================================
# AsoulOpt 内置游戏清单的等价配置（324 个应用）
#
# 本文件不随安装自动生效，避免覆盖你已有的规则。启用方式二选一：
#   1) 设置页「规则配置文件」改为 /data/adb/modules/AppOpt/applist.asoulopt.conf
#   2) cp /data/adb/modules/AppOpt/applist.asoulopt.conf /data/adb/modules/AppOpt/applist.conf
#
# 生成命令：python3 tools/asopt2appopt.py --full -o 本文件
# ============================================================
# 由 tools/asopt2appopt.py 从 AsoulOpt 的 asopt.conf 转换生成
# 原始全局值：mode=0（硬亲和），rt=0（关闭）
# 共 324 个受管应用，其中 0 个使用软/硬迁移
# ============================================================
#
# 转换说明：
# 1. AsoulOpt 的模型是「1 个超大核线程 + 1 个中核线程 + 其余全下放小核」，
#    运行时按 schedstat 挑「最闲」的线程上大核。AppOpt 没有负载挑选，
#    这里按线程语义静态化：
#       主线程类      → hp-core
#       图形/渲染类   → p-core,hp-core
#       其余工作线程  → e-core
# 2. 只写线程规则、不写包级规则。未命中线程名的线程保持原亲和性，
#    与 AsoulOpt「未命中名表完全不动」一致。
# 3. mode=1/2 在 AsoulOpt 里是写 cpuset + WALT/fpsgo 提示让厂商调度器配合，
#    AppOpt 无此通道，改用 @sched=on 在允许集合内按负载换簇（近似，非等价）。
#    AppOpt 的 @sched 是全局开关，不能像 mode 那样逐游戏设置。
# 4. rt=1 映射为 @rt.app=<包> on auto 2：同样用 SCHED_RR|SCHED_RESET_ON_FORK、
#    优先级 1，只提升本模块自己设置的线程。
# ============================================================

@unmatched=keep
@sched=off
@rt=off

# 原始配置里没有 rt=1 的应用，不生成 @rt.app

# ==================== 规则 ====================

# age.of.civilizations2.jakowski.lukasz（mode=0 硬亲和，rt=0）
age.of.civilizations2.jakowski.lukasz {
	MainThread=hp-core
	UnityMain=hp-core
	GameThread=hp-core
	_DummyMain=hp-core
	__DummyMain=hp-core
	__DoubleMain=hp-core
	MiniRainbowMain=hp-core
	WZM_Main=hp-core
	Mainloop=hp-core
	MINECRAFT MAIN=hp-core
	DAVA Engine Mai*=hp-core
	RenderThread=p-core,hp-core
	GLThread=p-core,hp-core
	UnityGfx*=p-core,hp-core
	RHIThread=p-core,hp-core
	VkThread=p-core,hp-core
	SDLThread=p-core,hp-core
	GPU Submission=p-core,hp-core
	SCERender=p-core,hp-core
	SHPD Render=p-core,hp-core
	MiniRenderThrea*=p-core,hp-core
	Render T*=p-core,hp-core
	Draw Thread=p-core,hp-core
	DAVA::RhiThread=p-core,hp-core
	Rendering Pool=p-core,hp-core
	RBX Worker=p-core,hp-core
	Thread-*=e-core
	FunctionMarshal=e-core
	TfLite=e-core
	Update Thread=e-core
}

