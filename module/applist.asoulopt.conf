# ============================================================
# AsoulOpt 内置游戏表（333 个应用 / 29 组规则）
#
# 本文件不随安装自动生效，避免覆盖你已有的规则。启用方式二选一：
#   1) 设置页「规则配置文件」改为 /data/adb/modules/AppOpt/applist.asoulopt.conf
#   2) cp /data/adb/modules/AppOpt/applist.asoulopt.conf /data/adb/modules/AppOpt/applist.conf
#
# 生成自 AsoulOpt Kana（versionCode 284）的内置结构：二进制里是 29 个
# 「包名数组 + 线程规则」分组。本文件逐组还原，每个应用只写它所在组
# 实际列出的线程名，而不是对全部应用套同一份 30 条名单。
#
# 簇映射：
#   主线程类      → hp-core
#   图形/渲染类   → p-core,hp-core
#   其余工作线程  → e-core
#   原始表里 count=0 的条目表示不处理，已跳过
#
# 与 AsoulOpt 的差异：原始实现按 schedstat 在候选线程里挑最闲的上大核，
# 并按 count 限制数量；AppOpt 只做静态亲和，没有负载挑选。所以这里是
# 「线程集合一致、分配策略近似」，不是逐字节等价。
# ============================================================

@unmatched=keep
@sched=off
@rt=off

# com.actgames.bbee
com.actgames.bbee {
	TfLite=e-core
	Thread-*=e-core
	UnityGfx=p-core,hp-core
	UnityMain=hp-core
}

